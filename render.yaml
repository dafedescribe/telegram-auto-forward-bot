# Secondary option — primary runner is GitHub Actions (hourly cron).
# Render type must be cron (one-shot backfill), not worker (would run once and exit).
services:
  - type: cron
    name: telegram-forwarder
    env: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python forwarder.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: SOURCE_CHATS
        value: "-1001234567890,-1009876543210"
      - key: DESTINATION_URL
        sync: false
      - key: LOOKBACK_HOURS
        value: "1"
      - key: MAX_BACKFILL
        value: "50"
      - key: CHUNK_SIZE
        value: "10"
